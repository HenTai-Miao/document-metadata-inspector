name: Build offline releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.12+8"
          cache: maven
          cache-dependency-path: java-worker/pom.xml
      - name: Install locked Python environment
        run: |
          uv python install 3.12.13
          uv sync --all-groups --locked
      - name: Verify Python project
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run basedpyright
          uv lock --check
          uv build
      - name: Verify Apache worker
        working-directory: java-worker
        run: ./mvnw --batch-mode --no-transfer-progress verify

  release:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: windows-2025
            platform: windows-x86_64
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.12+8"
          cache: maven
          cache-dependency-path: java-worker/pom.xml
      - name: Install locked Python environment
        run: |
          uv python install 3.12.13
          uv sync --all-groups --locked
      - name: Build and self-test native one-file program
        run: uv run python scripts/build_release.py --mode onefile
      - name: Create checksummed delivery archive
        run: uv run python scripts/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: document-metadata-inspector-${{ matrix.platform }}
          path: release/document-metadata-inspector-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14
